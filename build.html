<script type="module">

function fitBuildPageToHost() {
    const root = document.getElementById('build-page-root');
    if (!root) return;

    const host = root.parentElement;
    const rect = root.getBoundingClientRect();

    const viewportHeight = window.visualViewport
        ? window.visualViewport.height
        : window.innerHeight;

    const availableHeight = Math.max(0, Math.floor(viewportHeight - rect.top));

    root.style.height = `${availableHeight}px`;
    root.style.maxHeight = `${availableHeight}px`;
    root.style.minHeight = '0';
    root.style.overflow = 'hidden';

    if (host) {
        host.style.minHeight = '0';
        host.style.overflow = 'hidden';
    }
}

function setupBuildPageSizing() {
    fitBuildPageToHost();

    const root = document.getElementById('build-page-root');
    if (!root) return;

    if (window.ResizeObserver) {
        const ro = new ResizeObserver(() => fitBuildPageToHost());
        ro.observe(root);
        if (root.parentElement) ro.observe(root.parentElement);
    }

    window.addEventListener('resize', fitBuildPageToHost);

    if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', fitBuildPageToHost);
        window.visualViewport.addEventListener('scroll', fitBuildPageToHost);
    }

    requestAnimationFrame(fitBuildPageToHost);
    setTimeout(fitBuildPageToHost, 0);
    setTimeout(fitBuildPageToHost, 50);
}

	let customPaletteState = {
    dbKey: null,
    slot: null,
    itemId: null,
    styleId: null,
    h: 0,
    s: 0,
    v: 0,
    dragging: false,
    suppressInputEcho: false
};


const COLOR_MATCH_TOLERANCE = 0;

const BITCHIP_TEMPLATE_SOURCE_COLORS = {
    base: '#8095ba',
    midtone: '#6f82a2',
    outline: '#576885'
};

const SPINGEAR_TOPDOWN_EXTRA_SOURCE_COLORS = {
    darkMidtone: '#5d6e8d',
    darkOutline: '#53627e'
};

function getRawImage(part, isTopDown = false) {
    if (!part) return '';
    let key = isTopDown ? 'topDownImage' : 'image';
    if (part.activeStyle && part.activeStyle[key]) return part.activeStyle[key];
    if (part.styles && part.styles.length > 0 && part.styles[0][key]) return part.styles[0][key];
    return part.fallbackImage || part[key] || '';
}

function getSafeImage(part, isTopDown = false) {
    if (!part) return '';

    if (part.spinGearUsesCustomPalette === true) {
        return getRenderedCustomSpinGearImage(part, isTopDown);
    }

    if (part.template === true) {
        return getRenderedTemplateBitChipImage(part, isTopDown);
    }

    return getRawImage(part, isTopDown);
}

function clamp(value, min, max) {
    return Math.min(max, Math.max(min, value));
}

function wrapHue(h) {
    let out = h % 360;
    if (out < 0) out += 360;
    return out;
}

function normalizeHex(hex) {
    if (!hex) return '#000000';
    let out = String(hex).trim().replace('#', '');
    if (out.length === 3) {
        out = out.split('').map(c => c + c).join('');
    }
    return `#${out.substring(0, 6).padEnd(6, '0')}`.toLowerCase();
}

function hexToRgb(hex) {
    const clean = normalizeHex(hex).replace('#', '');
    return {
        r: parseInt(clean.substring(0, 2), 16),
        g: parseInt(clean.substring(2, 4), 16),
        b: parseInt(clean.substring(4, 6), 16)
    };
}

function rgbToHex(r, g, b) {
    return '#' + [r, g, b]
        .map(v => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0'))
        .join('');
}

function rgbToHsv(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    const max = Math.max(r, g, b);
    const min = Math.min(r, g, b);
    const d = max - min;

    let h = 0;
    const s = max === 0 ? 0 : d / max;
    const v = max;

    if (d !== 0) {
        switch (max) {
            case r: h = 60 * (((g - b) / d) % 6); break;
            case g: h = 60 * (((b - r) / d) + 2); break;
            case b: h = 60 * (((r - g) / d) + 4); break;
        }
    }

    return {
        h: wrapHue(h),
        s: Math.round(s * 100),
        v: Math.round(v * 100)
    };
}

function hsvToRgb(h, s, v) {
    h = wrapHue(h);
    s = clamp(s, 0, 100) / 100;
    v = clamp(v, 0, 100) / 100;

    const c = v * s;
    const x = c * (1 - Math.abs((h / 60) % 2 - 1));
    const m = v - c;

    let r1 = 0, g1 = 0, b1 = 0;

    if (h < 60) [r1, g1, b1] = [c, x, 0];
    else if (h < 120) [r1, g1, b1] = [x, c, 0];
    else if (h < 180) [r1, g1, b1] = [0, c, x];
    else if (h < 240) [r1, g1, b1] = [0, x, c];
    else if (h < 300) [r1, g1, b1] = [x, 0, c];
    else [r1, g1, b1] = [c, 0, x];

    return {
        r: Math.round((r1 + m) * 255),
        g: Math.round((g1 + m) * 255),
        b: Math.round((b1 + m) * 255)
    };
}

function hexToHsv(hex) {
    const { r, g, b } = hexToRgb(hex);
    return rgbToHsv(r, g, b);
}

function hsvToHex(h, s, v) {
    const { r, g, b } = hsvToRgb(h, s, v);
    return rgbToHex(r, g, b);
}

function rgbToHsl(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    const max = Math.max(r, g, b);
    const min = Math.min(r, g, b);
    const d = max - min;
    const l = (max + min) / 2;

    let h = 0;
    let s = 0;

    if (d !== 0) {
        s = d / (1 - Math.abs(2 * l - 1));
        switch (max) {
            case r: h = 60 * (((g - b) / d) % 6); break;
            case g: h = 60 * (((b - r) / d) + 2); break;
            case b: h = 60 * (((r - g) / d) + 4); break;
        }
    }

    return {
        h: wrapHue(h),
        s: Math.round(s * 100),
        l: Math.round(l * 100)
    };
}

function hslToRgb(h, s, l) {
    h = wrapHue(h);
    s = clamp(s, 0, 100) / 100;
    l = clamp(l, 0, 100) / 100;

    const c = (1 - Math.abs(2 * l - 1)) * s;
    const x = c * (1 - Math.abs((h / 60) % 2 - 1));
    const m = l - c / 2;

    let r1 = 0, g1 = 0, b1 = 0;

    if (h < 60) [r1, g1, b1] = [c, x, 0];
    else if (h < 120) [r1, g1, b1] = [x, c, 0];
    else if (h < 180) [r1, g1, b1] = [0, c, x];
    else if (h < 240) [r1, g1, b1] = [0, x, c];
    else if (h < 300) [r1, g1, b1] = [x, 0, c];
    else [r1, g1, b1] = [c, 0, x];

    return {
        r: Math.round((r1 + m) * 255),
        g: Math.round((g1 + m) * 255),
        b: Math.round((b1 + m) * 255)
    };
}

function deriveRampFromBase(hex) {
    hex = normalizeHex(hex);
    let { h, s, v } = hexToHsv(hex);

    let midH = h;
    let midS = s;
    let outH = h;
    let outS = s;

    if (s < 12) {
        outH = wrapHue(h - 8);
        outS = s + 4;
    } else if (h < 20 || h >= 340) {
        midH = wrapHue(h - 8);
        midS = s + 2;
        outH = wrapHue(h - 13);
        outS = s - 4;
    } else if (h >= 20 && h < 70) {
        midH = wrapHue(h - 1);
        midS = s;
        outH = wrapHue(h - 2);
        outS = s - 2;
    } else if (h >= 70 && h < 170) {
        midH = wrapHue(h - 8);
        midS = s;
        outH = wrapHue(h + 2);
        outS = s - 8;
    } else if (h >= 170 && h < 210) {
        midH = wrapHue(h - 3);
        midS = s - 4;
        outH = h;
        outS = s - 6;
    } else if (h >= 210 && h < 250) {
        midH = wrapHue(h + 3);
        midS = s - 6;
        outH = wrapHue(h + 7);
        outS = s - 10;
    } else {
        midH = wrapHue(h - 2);
        midS = s + 2;
        outH = wrapHue(h - 3);
        outS = s + 4;
    }

    const midV = v * 0.867;
    const outV = v * 0.700;

    return {
        base: hex,
        midtone: hsvToHex(midH, clamp(midS, 0, 100), clamp(midV, 0, 100)),
        outline: hsvToHex(outH, clamp(outS, 0, 100), clamp(outV, 0, 100))
    };
}

function seedTemplateBitChipColors(part) {
    if (!part || part.template !== true) return;

    const base = normalizeHex(part.bitchipBaseColor || BITCHIP_TEMPLATE_SOURCE_COLORS.base);
    const ramp = deriveRampFromBase(base);

    part.bitchipBaseColor = base;
    part.bitchipMidtoneColor = normalizeHex(part.bitchipMidtoneColor || ramp.midtone);
    part.bitchipOutlineColor = normalizeHex(part.bitchipOutlineColor || ramp.outline);
}

function clearTemplateBitChipRenderCache(part) {
    if (!part) return;
    delete part._renderedBitChipImage;
    delete part._renderedBitChipTopDownImage;
    delete part._renderingBitChipImage;
    delete part._renderingBitChipTopDownImage;
}

const _templateImageCache = new Map();

function loadImageCached(src) {
    if (_templateImageCache.has(src)) return _templateImageCache.get(src);

    const promise = new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = src;
    });

    _templateImageCache.set(src, promise);
    return promise;
}

function colorDistance(r1, g1, b1, r2, g2, b2) {
    return Math.abs(r1 - r2) + Math.abs(g1 - g2) + Math.abs(b1 - b2);
}

async function buildRecoloredDataUrlFromMap(sourceSrc, replacements) {
    const img = await loadImageCached(sourceSrc);
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });

    canvas.width = img.width;
    canvas.height = img.height;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0);

    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const data = imageData.data;

    const compiled = replacements.map(entry => ({
        source: hexToRgb(entry.source),
        target: hexToRgb(entry.target)
    }));

    for (let i = 0; i < data.length; i += 4) {
        const r = data[i];
        const g = data[i + 1];
        const b = data[i + 2];
        const a = data[i + 3];
        if (a === 0) continue;

        for (const pair of compiled) {
            if (colorDistance(r, g, b, pair.source.r, pair.source.g, pair.source.b) <= COLOR_MATCH_TOLERANCE) {
                data[i] = pair.target.r;
                data[i + 1] = pair.target.g;
                data[i + 2] = pair.target.b;
                break;
            }
        }
    }

    ctx.putImageData(imageData, 0, 0);
    return canvas.toDataURL('image/png');
}

function deriveSpinGearRampFromBase(hex) {
    const core = deriveRampFromBase(hex);

    const mid = hexToHsv(core.midtone);
    const out = hexToHsv(core.outline);

    return {
        base: core.base,
        midtone: core.midtone,
        outline: core.outline,

        // Tuned from your reference:
        // #6f82a2 -> #5d6e8d
        darkMidtone: hsvToHex(
            wrapHue(mid.h + 1),
            clamp(mid.s + 2, 0, 100),
            clamp(mid.v * 0.87, 0, 100)
        ),

        // Tuned from your reference:
        // #576885 -> #53627e
        darkOutline: hsvToHex(
            wrapHue(out.h + 1),
            clamp(out.s, 0, 100),
            clamp(out.v * 0.947, 0, 100)
        )
    };
}

function seedSpinGearCustomColors(part) {
    if (!part || part.allowCustomPalette !== true) return;

    const base = normalizeHex(part.spinGearBaseColor || BITCHIP_TEMPLATE_SOURCE_COLORS.base);
    const ramp = deriveSpinGearRampFromBase(base);

    part.spinGearBaseColor = base;
    part.spinGearMidtoneColor = normalizeHex(part.spinGearMidtoneColor || ramp.midtone);
    part.spinGearOutlineColor = normalizeHex(part.spinGearOutlineColor || ramp.outline);
    part.spinGearDarkMidtoneColor = normalizeHex(part.spinGearDarkMidtoneColor || ramp.darkMidtone);
    part.spinGearDarkOutlineColor = normalizeHex(part.spinGearDarkOutlineColor || ramp.darkOutline);
}

function getBitChipReplacementMap(part) {
    seedTemplateBitChipColors(part);

    return [
        { source: BITCHIP_TEMPLATE_SOURCE_COLORS.base, target: normalizeHex(part.bitchipBaseColor) },
        { source: BITCHIP_TEMPLATE_SOURCE_COLORS.midtone, target: normalizeHex(part.bitchipMidtoneColor) },
        { source: BITCHIP_TEMPLATE_SOURCE_COLORS.outline, target: normalizeHex(part.bitchipOutlineColor) }
    ];
}

function getSpinGearReplacementMap(part, isTopDown = false) {
    seedSpinGearCustomColors(part);

    const map = [
        { source: BITCHIP_TEMPLATE_SOURCE_COLORS.base, target: normalizeHex(part.spinGearBaseColor) },
        { source: BITCHIP_TEMPLATE_SOURCE_COLORS.midtone, target: normalizeHex(part.spinGearMidtoneColor) },
        { source: BITCHIP_TEMPLATE_SOURCE_COLORS.outline, target: normalizeHex(part.spinGearOutlineColor) }
    ];

    if (isTopDown) {
        map.push(
            { source: SPINGEAR_TOPDOWN_EXTRA_SOURCE_COLORS.darkMidtone, target: normalizeHex(part.spinGearDarkMidtoneColor) },
            { source: SPINGEAR_TOPDOWN_EXTRA_SOURCE_COLORS.darkOutline, target: normalizeHex(part.spinGearDarkOutlineColor) }
        );
    }

    return map;
}

function clearCustomPaletteCache(part) {
    if (!part) return;

    delete part._renderedBitChipImage;
    delete part._renderedBitChipTopDownImage;
    delete part._renderingBitChipImage;
    delete part._renderingBitChipTopDownImage;

    delete part._renderedSpinGearImage;
    delete part._renderedSpinGearTopDownImage;
    delete part._renderingSpinGearImage;
    delete part._renderingSpinGearTopDownImage;
}

function refreshBitChipRenders() {
    window.renderLeftPanel();
    window.renderAssemblyVisual();
    window.renderSaveSlots();
    if (lastInspectedSlot === 'bitChip' && currentBuild.bitChip) {
        window.updateInspectorUI('bitChip');
    }
}

function getRenderedTemplateBitChipImage(part, isTopDown = false) {
    seedTemplateBitChipColors(part);

    const cacheKey = isTopDown ? '_renderedBitChipTopDownImage' : '_renderedBitChipImage';
    const busyKey = isTopDown ? '_renderingBitChipTopDownImage' : '_renderingBitChipImage';

    if (part[cacheKey]) return part[cacheKey];
    if (part[busyKey]) return getRawImage(part, isTopDown);

    const source = getRawImage(part, isTopDown);
    if (!source) return '';

    part[busyKey] = true;

    buildRecoloredDataUrlFromMap(source, getBitChipReplacementMap(part)).then(dataUrl => {
        part[cacheKey] = dataUrl;
        part[busyKey] = false;
        window.renderLeftPanel();
        window.renderAssemblyVisual();
        window.renderSaveSlots();
        if (lastInspectedSlot === 'bitChip') window.updateInspectorUI('bitChip');
    }).catch(err => {
        console.error('Bit Chip recolor failed:', err);
        part[busyKey] = false;
    });

    return source;
}

function getRenderedCustomSpinGearImage(part, isTopDown = false) {
    seedSpinGearCustomColors(part);

    const cacheKey = isTopDown ? '_renderedSpinGearTopDownImage' : '_renderedSpinGearImage';
    const busyKey = isTopDown ? '_renderingSpinGearTopDownImage' : '_renderingSpinGearImage';

    if (part[cacheKey]) return part[cacheKey];
    if (part[busyKey]) return getRawImage(part, isTopDown);

    const source = getRawImage(part, isTopDown);
    if (!source) return '';

    part[busyKey] = true;

    buildRecoloredDataUrlFromMap(source, getSpinGearReplacementMap(part, isTopDown)).then(dataUrl => {
        part[cacheKey] = dataUrl;
        part[busyKey] = false;
        window.renderLeftPanel();
        window.renderAssemblyVisual();
        window.renderSaveSlots();
        if (lastInspectedSlot === 'spinGear') window.updateInspectorUI('spinGear');
    }).catch(err => {
        console.error('Spin Gear recolor failed:', err);
        part[busyKey] = false;
    });

    return source;
}

function getCurrentTemplateBaseHex() {
    return hsvToHex(customPaletteState.h, customPaletteState.s, customPaletteState.v);
}

function setTemplateStateFromHex(hex) {
    const hsv = hexToHsv(hex);
    customPaletteState.h = hsv.h;
    customPaletteState.s = hsv.s;
    customPaletteState.v = hsv.v;
}

function syncTemplateInputsFromState() {
    customPaletteState.suppressInputEcho = true;

    const hex = getCurrentTemplateBaseHex();
    const rgb = hexToRgb(hex);
    const hsv = hexToHsv(hex);
    const hsl = rgbToHsl(rgb.r, rgb.g, rgb.b);

    document.getElementById('bc-hex').value = hex;
    document.getElementById('bc-r').value = rgb.r;
    document.getElementById('bc-g').value = rgb.g;

    document.getElementById('bc-h').value = Math.round(hsv.h);

function drawTemplateSpectrum() {
    const canvas = document.getElementById('bc-spectrum-canvas');
    const ctx = canvas.getContext('2d');
    const { width, height } = canvas;

    ctx.clearRect(0, 0, width, height);

    ctx.fillStyle = `hsl(${customPaletteState.h}, 100%, 50%)`;
    ctx.fillRect(0, 0, width, height);

    const whiteGrad = ctx.createLinearGradient(0, 0, width, 0);
    whiteGrad.addColorStop(0, '#ffffff');
    whiteGrad.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = whiteGrad;
    ctx.fillRect(0, 0, width, height);

    const blackGrad = ctx.createLinearGradient(0, 0, 0, height);
    blackGrad.addColorStop(0, 'rgba(0,0,0,0)');
    blackGrad.addColorStop(1, '#000000');
    ctx.fillStyle = blackGrad;
    ctx.fillRect(0, 0, width, height);

    const x = (customPaletteState.s / 100) * width;
    const y = ((100 - customPaletteState.v) / 100) * height;

    ctx.beginPath();
    ctx.arc(x, y, 7, 0, Math.PI * 2);
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#ffffff';
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(x, y, 9, 0, Math.PI * 2);
    ctx.lineWidth = 1;
    ctx.strokeStyle = '#000000';
    ctx.stroke();
}

function pickTemplateSpectrumPoint(clientX, clientY) {
    const canvas = document.getElementById('bc-spectrum-canvas');
    const rect = canvas.getBoundingClientRect();

    const x = clamp(clientX - rect.left, 0, rect.width);
    const y = clamp(clientY - rect.top, 0, rect.height);

    customPaletteState.s = Math.round((x / rect.width) * 100);
    customPaletteState.v = Math.round(100 - ((y / rect.height) * 100));

    function getPreferredSpinValue(part, baseKey, spinDirection) {
        if (!part) return baseKey === "stats" ? {} : [];

        const dir = normalizeSpinDirection(spinDirection);
        const preferredKey = dir === "Left" ? `${baseKey}Left` : `${baseKey}Right`;
        const alternateKey = dir === "Left" ? `${baseKey}Right` : `${baseKey}Left`;

        if (part[preferredKey] != null) return deepClone(part[preferredKey]);

        // Legacy default support: plain `stats`, `attacks`, `passives`
        if (dir === "Right" && part[baseKey] != null) return deepClone(part[baseKey]);

        if (part[alternateKey] != null) return deepClone(part[alternateKey]);
        if (part[baseKey] != null) return deepClone(part[baseKey]);

        return baseKey === "stats" ? {} : [];
    }

	function scaleLADValue(rawLAD) {
    const numeric = Number(rawLAD);
    if (!Number.isFinite(numeric)) return null;

    // 0.1 -> 1, 0.6 -> 6, 0.94 -> 9.4
    return Math.round(numeric * 100) / 10;
}

function getLADStarCount(rawLAD) {
    const scaled = scaleLADValue(rawLAD);
    if (scaled == null) return 0;

    if (scaled >= 7) return 3;
    if (scaled >= 4) return 2;
    if (scaled >= 1) return 1;
    return 0;
}

function formatLADDisplay(rawLAD) {
    const scaled = scaleLADValue(rawLAD);
    if (scaled == null) return String(rawLAD ?? '');

    const numberText = Number.isInteger(scaled)
        ? String(scaled)
        : scaled.toFixed(1).replace(/\.0$/, '');

    const stars = '★'.repeat(getLADStarCount(rawLAD));

    return stars ? `${numberText} ${stars}` : numberText;
}

function formatBuildStatValue(statKey, value) {
    if (value == null) return '';

    if (statKey === 'lad') {
        return formatLADDisplay(value);
    }

    if (statKey === 'weight') {
        return `${value}g`;
    }

    if (["recoilReduction", "spiritCharge", "cdr"].includes(statKey)) {
        return `${value}%`;
    }

    return String(value);
}

async function renderCustomPalettePreview() {
    const item = window.equipmentDB[customPaletteState.dbKey]?.find(i => i.id === customPaletteState.itemId);
    if (!item) return;

    const previewPart = deepClone(item);

    if (previewPart.styles && previewPart.styles.length > 0) {
        previewPart.activeStyle =
            previewPart.styles.find(s => s.styleId === customPaletteState.styleId) ||
            previewPart.styles[0];
    }

    const baseHex = getCurrentTemplateBaseHex();

    if (customPaletteState.dbKey === 'spinGears') {
        const ramp = deriveSpinGearRampFromBase(baseHex);
        previewPart.spinGearUsesCustomPalette = true;
        previewPart.spinGearBaseColor = ramp.base;
        previewPart.spinGearMidtoneColor = ramp.midtone;
        previewPart.spinGearOutlineColor = ramp.outline;
        previewPart.spinGearDarkMidtoneColor = ramp.darkMidtone;
        previewPart.spinGearDarkOutlineColor = ramp.darkOutline;

        const source = getRawImage(previewPart, false);
        if (!source) return;

        const dataUrl = await buildRecoloredDataUrlFromMap(source, getSpinGearReplacementMap(previewPart, false));
        const img = await loadImageCached(dataUrl);

        const canvas = document.getElementById('bc-preview-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = img.width;
        canvas.height = img.height;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0);
        return;
    }

    // Bit Chip path
    const ramp = deriveRampFromBase(baseHex);
    previewPart.bitchipBaseColor = ramp.base;
    previewPart.bitchipMidtoneColor = ramp.midtone;
    previewPart.bitchipOutlineColor = ramp.outline;

    const source = getRawImage(previewPart, false);
    if (!source) return;

    const dataUrl = await buildRecoloredDataUrlFromMap(source, getBitChipReplacementMap(previewPart));
    const img = await loadImageCached(dataUrl);

    const canvas = document.getElementById('bc-preview-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = img.width;
    canvas.height = img.height;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0);
}

            const requiredType = requiredSubRingType();
            if (!requiredType || item.subRingType !== requiredType) {
                playNegativeSfx();
                return;
            }

        // Legacy/manual-modify support

                item.passives = item.passives.map(p => p.includes("Alter Approach") ? "Alter Approach (Flat)" : p);

        window.renderLeftPanel();
        calculateAndRenderTotals();

        function calculateAndRenderTotals() {
        let totals = { hp: 0, rpm: 0, attack: 0, recoil: 0, recoilReduction: 0, defense: 0, endurance: 0, stamina: 0, balance: 0, weight: 0, speed: 0, mobility: 0, grip: 0, spiritCharge: 0, cdr: 0, lad: 0 };
        let passives = [];
        let attacks = [];
        let ultimate = null;

        const buildSpinDirection = getBuildSpinDirection();
        const spinDirectionLabel = getBuildSpinDirectionLabel();

        const slotNames = {
            bitChip: "Bit Chip",
            attackRing: "Attack Ring",
            subAttackRing: "Sub-Attack Ring",
            weightDisk: "Weight Disk",
            spinGear: "Spin Gear",
            bladeBase: "Blade Base",
            launcher: "Launcher",
            ripCord: "Rip Cord"
        };

        Object.entries(currentBuild).forEach(([slot, part]) => {
            if (!part) return;

            let partName = part.activeStyle ? part.activeStyle.styleName : part.name;
            let originText = `${slotNames[slot]}: ${partName}`;
            const spinData = getPartSpinData(part, buildSpinDirection);

            const resolvedStats = spinData.stats || {};
            const resolvedPassives = spinData.passives || [];
            const resolvedAttacks = spinData.attacks || [];

            for (let stat in resolvedStats) {
                if (totals[stat] !== undefined) totals[stat] += resolvedStats[stat];
            }

            resolvedPassives.forEach(passiveName => {
                let desc = "";
                if (window.SkillsDB && window.SkillsDB.passives && window.SkillsDB.passives[passiveName]) {
                    desc = window.SkillsDB.passives[passiveName].desc;
                }
                passives.push({ name: passiveName, desc: desc, source: originText });
            });

            resolvedAttacks.forEach(atkObj => {
                let desc = "";
                if (window.SkillsDB && window.SkillsDB.attacks && window.SkillsDB.attacks[atkObj.name]) {
                    desc = window.SkillsDB.attacks[atkObj.name].desc;
                }
                attacks.push({ name: atkObj.name, cd: atkObj.cd, desc: desc, source: originText });
            });

            if (part.specialLaunch) {
                part.specialLaunch.forEach(sl => {
                    let skillKey = `Special Launch: ${sl}`;
                    let desc = "";

                    if (window.SkillsDB && window.SkillsDB.passives && window.SkillsDB.passives[skillKey]) {
                        desc = window.SkillsDB.passives[skillKey].desc;
                    }

                    passives.push({ name: skillKey, desc: desc, source: originText });
                });
            }

            if (part.ultimate) {
                ultimate = { name: part.ultimate.name, desc: part.ultimate.desc, source: originText };
            }
        });

        let atkScore = totals.attack + totals.speed + totals.mobility + totals.grip;
        let defScore = totals.defense + totals.recoilReduction + (totals.weight * 0.2) + (totals.hp * 0.3);
        let staScore = totals.stamina + totals.balance + (totals.rpm * 0.275) + totals.endurance;

        let maxScore = Math.max(atkScore, defScore, staScore);
        let type = "Unknown";

        if (maxScore > 0) {
            let threshold = maxScore * 0.85;
            let closeScores = [atkScore, defScore, staScore].filter(score => score >= threshold).length;
            if (closeScores > 1) type = "Balance";
            else if (maxScore === atkScore) type = "Attack";
            else if (maxScore === defScore) type = "Defense";
            else type = "Stamina";
        }

        const statOrder = [
            "hp", "rpm", "attack", "defense", "stamina", "endurance",
            "speed", "mobility", "grip", "balance", "weight",
            "recoil", "recoilReduction", "spiritCharge", "cdr", "lad"
        ];

        const statLabels = {
            hp: "HP", rpm: "RPM", attack: "ATTACK", defense: "DEFENSE",
            stamina: "STAMINA", endurance: "ENDURANCE", speed: "SPEED",
            mobility: "MOBILITY", grip: "GRIP", balance: "BALANCE",
            weight: "WEIGHT", recoil: "RECOIL", recoilReduction: "RECOIL RED.",
            spiritCharge: "SPIRIT CHARGE", cdr: "COOLDOWN RED.", lad: "LAD"
        };

let statHtml = '';

statOrder.forEach(key => {
    if (totals[key] !== undefined) {
        const displayValue = formatBuildStatValue(key, totals[key]);
        statHtml += `<div><b>${statLabels[key]}:</b> ${displayValue}</div>`;
    }
});

statHtml += `<div style="grid-column: span 2; margin-top: 10px; padding-top: 10px; border-top: 1px solid #444; color: #00ffff;">
                <b>TYPE:</b> ${type} &nbsp;|&nbsp; <b>SPIN:</b> ${spinDirectionLabel}
             </div>`;

document.getElementById('total-stats').innerHTML = statHtml;

const safeParse = window.parseKeywords || function(text) { return text; };

        let passiveHtml = '';
        if (passives.length === 0) passiveHtml = `<div style="color: #666; font-style: italic; font-size: 12px; margin-top: 5px;">None equipped</div>`;
        passives.forEach(p => {
            let descText = p.desc ? `<div style="font-size: 11px; color: #ccc; margin-top: 4px; line-height: 1.3;">${safeParse(p.desc)}</div>` : '';
            passiveHtml += `<div class="passive-box">
                                <span class="skill-source">${p.source}</span>
                                <strong style="color: #fff; font-size: 13px;">${p.name}</strong>
                                ${descText}
                            </div>`;
        });
        document.getElementById('passives-list').innerHTML = passiveHtml;

        let attackHtml = '';
        if (attacks.length === 0) attackHtml = `<div style="color: #666; font-style: italic; font-size: 12px; margin-top: 5px;">None equipped</div>`;
        attacks.forEach(atk => {
            let descText = atk.desc ? `<div style="font-size: 11px; color: #ccc; margin-top: 4px; line-height: 1.3;">${safeParse(atk.desc)}</div>` : '';
            attackHtml += `<div class="attack-box">
                               <span class="skill-source">${atk.source}</span>
                               <strong style="color: #fff; font-size: 13px;">${atk.name}</strong>
                               <span style="font-size:11px; color:#ddd; float:right;">${atk.cd}s</span>
                               ${descText}
                           </div>`;
        });
        document.getElementById('attacks-list').innerHTML = attackHtml;

        if (ultimate) {
            document.getElementById('ultimate-container').innerHTML = `
                <div class="ultimate-box">
                    <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                        <span style="color: #ffaa00; font-size: 12px; font-weight: 900; letter-spacing: 1px;">ULTIMATE TECHNIQUE</span>
                        <span class="skill-source" style="text-align: right; margin: 0;">${ultimate.source}</span>
                    </div>
                    <strong style="font-size: 16px; color: #fff; display: block; margin: 5px 0;">${ultimate.name}</strong>
                    <span style="font-size: 13px; color: #ccc; line-height: 1.4;">${safeParse(ultimate.desc)}</span>
                </div>`;
        } else {
            document.getElementById('ultimate-container').innerHTML = '';
        }

        window.renderAssemblyVisual();
        window.renderSaveSlots();
    }

    // BOOT SEQUENCE
    window.switchTab('bitChips');
    window.renderSaveSlots(); 
</script>
